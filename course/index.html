<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Win Academy</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e5e5e5; --accent:#1f6feb; --side:#f7f7f8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141414; --fg:#eee; --muted:#999; --line:#2a2a2a; --accent:#58a6ff; --side:#1b1b1b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    .app { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
    aside { background:var(--side); border-right:1px solid var(--line); padding:20px 16px; overflow-y:auto; }
    aside h1 { font-size:20px; margin:0 0 4px; }
    aside .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .progress { height:6px; background:var(--line); border-radius:3px; margin-bottom:18px; }
    .progress > div { height:100%; background:var(--accent); border-radius:3px; width:0; transition:width .2s; }
    .mod { font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
    .lesson { display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg); padding:8px 10px; border-radius:6px; cursor:pointer; font:inherit; font-size:15px; }
    .lesson:hover { background:var(--line); }
    .lesson.active { background:var(--accent); color:#fff; }
    .lesson.done::before { content:"✓ "; }
    main { padding:32px 40px; max-width:820px; }
    main img, main iframe { max-width:100%; }
    .nav { display:flex; justify-content:space-between; gap:12px; margin-top:40px; padding-top:20px; border-top:1px solid var(--line); }
    .nav button { padding:10px 18px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; font:inherit; }
    .nav button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .nav button:disabled { opacity:.4; cursor:default; }
    .toggle { display:none; }
    @media (max-width: 760px) {
      .app { grid-template-columns:1fr; }
      aside { display:none; border-right:0; border-bottom:1px solid var(--line); }
      aside.open { display:block; }
      .toggle { display:block; width:100%; padding:12px 16px; border:0; border-bottom:1px solid var(--line); background:var(--side); color:var(--fg); font:inherit; text-align:left; }
      main { padding:20px 16px; }
    }
  </style>
</head>
<body>
  <button class="toggle" id="toggle">☰ Course menu</button>
  <div class="app">
    <aside id="side">
      <h1 id="title">Loading…</h1>
      <div class="sub" id="subtitle"></div>
      <div class="progress"><div id="bar"></div></div>
      <nav id="toc"></nav>
    </aside>
    <main>
      <article id="content"></article>
      <div class="nav">
        <button id="prev">← Previous</button>
        <button id="next" class="primary">Mark complete &amp; next →</button>
      </div>
    </main>
  </div>

<script>
// Minimal built-in Markdown renderer (no external dependencies).
// Supports: headings, bold/italic, inline code, links, images, lists, blockquotes, hr, raw HTML lines.
function md(src) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = s => esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_]+)_(?=\W|$)/g, "$1<em>$2</em>");
  const out = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<" + list.t + ">" + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + "</" + list.t + ">"); list = null; } };
  const flush = () => { flushPara(); flushList(); };
  for (const raw of src.replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flush(); continue; }
    if (/^\s*</.test(line)) { flush(); out.push(line); continue; }            // raw HTML (iframes, comments)
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flush(); out.push("<hr>"); continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { flush(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const t = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara(); if (!list || list.t !== t) { flushList(); list = { t, items: [] }; }
      list.items.push(m[1]); continue;
    }
    flushList(); para.push(line.trim());
  }
  flush();
  return out.join("\n");
}

const COURSE_BASE = "../course/";
const STORE_KEY = "win-academy-progress";
let lessons = [], current = 0, done = new Set();

function load() { try { done = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) {} }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...done])); } catch (e) {} }

function renderToc(course) {
  const toc = document.getElementById("toc");
  toc.innerHTML = "";
  course.modules.forEach(m => {
    const h = document.createElement("div"); h.className = "mod"; h.textContent = m.title; toc.appendChild(h);
    m.lessons.forEach(l => {
      const i = lessons.findIndex(x => x.key === m.id + "/" + l.id);
      const b = document.createElement("button");
      b.className = "lesson" + (i === current ? " active" : "") + (done.has(lessons[i].key) ? " done" : "");
      b.textContent = l.title;
      b.onclick = () => show(i);
      toc.appendChild(b);
    });
  });
  document.getElementById("bar").style.width = (lessons.length ? done.size / lessons.length * 100 : 0) + "%";
}

let courseData;
async function show(i) {
  current = i;
  const l = lessons[i];
  const el = document.getElementById("content");
  try {
    const res = await fetch(COURSE_BASE + l.file);
    if (!res.ok) throw new Error(res.status);
    el.innerHTML = md(await res.text());
  } catch (e) {
    el.innerHTML = "<p>Could not load <code>" + l.file + "</code>.</p>";
  }
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").textContent = i === lessons.length - 1 ? "Mark complete ✓" : "Mark complete & next →";
  location.hash = l.key;
  renderToc(courseData);
  document.getElementById("side").classList.remove("open");
  window.scrollTo(0, 0);
}

document.getElementById("prev").onclick = () => current > 0 && show(current - 1);
document.getElementById("next").onclick = () => {
  done.add(lessons[current].key); save();
  current < lessons.length - 1 ? show(current + 1) : renderToc(courseData);
};
document.getElementById("toggle").onclick = () => document.getElementById("side").classList.toggle("open");

(async () => {
  load();
  courseData = await (await fetch(COURSE_BASE + "course.json")).json();
  document.title = courseData.title;
  document.getElementById("title").textContent = courseData.title;
  document.getElementById("subtitle").textContent = courseData.subtitle || "";
  courseData.modules.forEach(m => m.lessons.forEach(l => lessons.push({ ...l, key: m.id + "/" + l.id })));
  const start = lessons.findIndex(l => l.key === location.hash.slice(1));
  show(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
